server:
  port: 8081
  compression:
    enabled: true

spring:
  application:
    name: user-service

  # Uklju?i ?itanje sa Config Server-a (ako nije dostupan, app i dalje podi?e sa lokalnim yml)
  config:
    import: "optional:configserver:"

  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://localhost:8888}
      label: ${CONFIG_GIT_BRANCH:main}
      username: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD:changeme}

    # Spring Cloud Bus (koristan za /busrefresh iz Config Server-a)
    bus:
      enabled: true
      destination: springCloudBus
      ack:
        enabled: true

  # ProblemDetails (HTTP API error payload)
  mvc:
    problemdetails:
      enabled: true

  # DataSource (PostgreSQL)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:teamnest_users}
    username: ${DB_USER:demo}
    password: ${DB_PASS:demo}
    hikari:
      pool-name: userServiceHikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA/Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: account_management_service
        jdbc.time_zone: UTC
        format_sql: false
        show_sql: false

  # Liquibase (YAML changelog)
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/master.yml
    rollback-file: target/liquibase-rollback.sql
    # ako koristi? vi?e shema, mo?e i:
    # contexts: default

  # RabbitMQ (za OutboxPublisherService i Spring Cloud Bus)
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:teamnest}
    password: ${RABBIT_PASS:teamnest}
    requested-heartbeat: 20s
    connection-timeout: 5s
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false

  # Security (ako user-service izla?e za?ti?en API)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI:http://localhost:8081/realms/teamnest-demo}

  # OpenAPI/Swagger-UI (springdoc)
  doc:
    swagger-ui:
      enabled: true

  web:
    locale: en_US

# Springdoc ? ako ?eli? da bude uredno grupisano
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    display-request-duration: true
    doc-expansion: none
  group-configs:
    - group: user-service
      paths-to-match: /api/**

# Eureka (po?to je dependency na classpath-u)
eureka:
  client:
    enabled: true
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    metadata-map:
      version: ${APP_VERSION:1.0.0-SNAPSHOT}

# Observability / Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,env,threaddump,loggers,liquibase,refresh,busrefresh
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db, rabbit, diskSpace, ping
        liveness:
          include: livenessState, ping
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true

# Resilience4j ? ako koristi? klijentske pozive iz user-service
resilience4j:
  circuitbreaker:
    instances:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 5s

# Custom app namespace ? messaging exchange/routing (koristi ih OutboxPublisherService)
app:
  messaging:
    exchanges:
      invite: ${INVITE_EXCHANGE:invite.events}
    routing:
      invite:
        redeemed: ${INVITE_REDEEMED_ROUTING:invite.redeemed}
        revoked: ${INVITE_REVOKED_ROUTING:invite.revoked}

# Logging
logging:
  level:
    org.springframework.cloud.config: INFO
    org.springframework.cloud.bus: INFO
    org.springframework.amqp: INFO
    org.springframework.boot.actuate.health: INFO
    org.springframework.vault: WARN
    org.hibernate.SQL: WARN
    com.teamnest: DEBUG
